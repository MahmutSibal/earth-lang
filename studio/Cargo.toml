[package]
name = "earth-studio"
version = "0.9.1"
edition = "2021"
description = "Earth Studio — Earth programlama dili için editör"
license = "MIT"

[[bin]]
name = "earth-studio"
path = "src/main.rs"

[dependencies]
earth = { path = ".." }
eframe = { version = "0.36", features = ["glow"] }
rfd = "0.17"
# Update checks: the system certificate store and, on Windows, the system proxy.
ureq = { version = "3", features = ["platform-verifier", "win-system-proxy"] }
sha2 = "0.11"
serde_json = "1"
# Sign-in: PKCE randomness and decoding profile pictures.
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
