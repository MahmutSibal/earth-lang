name: Release

# Pushing a tag such as v0.5.0 builds Earth Studio and publishes, with
# SHA-256 checksums, a GitHub release containing:
#   - EarthStudio-Kurulum.exe   the Windows installer
#   - earth-studio-linux-x64.tar.gz, earth-studio-macos-arm64.tar.gz
#     (Earth Studio plus the earth command-line interpreter)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Signing runs only once the secrets described in docs/imzalama.md exist.
      CAN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
        env:
          # Google sign-in; see studio/src/auth.rs. Without it Studio builds
          # with Google sign-in turned off.
          EARTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EARTH_GOOGLE_CLIENT_SECRET }}

      - name: Sign earth-studio.exe
        if: env.CAN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DAppVersion=$version /DBinDir=..\target\release windows\installer.iss

      - name: Sign the installer
        if: env.CAN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: windows/Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/Output/EarthStudio-Kurulum.exe

  unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: earth-studio-linux-x64.tar.gz
          - os: macos-latest
            archive: earth-studio-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
        env:
          # Google sign-in; see studio/src/auth.rs. Without it Studio builds
          # with Google sign-in turned off.
          EARTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EARTH_GOOGLE_CLIENT_SECRET }}
      - run: |
          mkdir earth-studio
          cp target/release/earth-studio target/release/earth README.md LICENSE earth-studio/
          tar czf ${{ matrix.archive }} earth-studio
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum EarthStudio-Kurulum.exe earth-studio-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            EarthStudio-Kurulum.exe
            earth-studio-*
            SHA256SUMS.txt
