name: Release

# Pushing a tag such as v0.5.0 builds Earth Studio and publishes, with
# SHA-256 checksums, a GitHub release containing:
#   - EarthStudio-Kurulum.exe   the Windows installer
#   - earth-cli-windows-x64.exe, earth-cli-linux-x64.tar.gz,
#     earth-cli-macos-arm64.tar.gz
#   - earth-studio-linux-x64.tar.gz, earth-studio-macos-arm64.tar.gz
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata
        run: python .github/scripts/validate-release.py "${{ github.ref_name }}"

  windows:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Signing runs only once the secrets described in docs/imzalama.md exist.
      CAN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
        env:
          # Google sign-in; see studio/src/auth.rs. Without it Studio builds
          # with Google sign-in turned off.
          EARTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EARTH_GOOGLE_CLIENT_SECRET }}

      - name: Sign earth-studio.exe
        if: env.CAN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DAppVersion=$version /DBinDir=..\target\release windows\installer.iss

      - name: Sign the installer
        if: env.CAN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: windows/Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare standalone Windows CLI
        shell: pwsh
        run: Copy-Item target/release/earth.exe earth-cli-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows/Output/EarthStudio-Kurulum.exe
            earth-cli-windows-x64.exe

  unix:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: earth-studio-linux-x64.tar.gz
            cli_archive: earth-cli-linux-x64.tar.gz
          - os: macos-latest
            archive: earth-studio-macos-arm64.tar.gz
            cli_archive: earth-cli-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
        env:
          # Google sign-in; see studio/src/auth.rs. Without it Studio builds
          # with Google sign-in turned off.
          EARTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EARTH_GOOGLE_CLIENT_SECRET }}
      - run: |
          mkdir earth-studio
          cp target/release/earth-studio target/release/earth README.md LICENSE earth-studio/
          tar czf ${{ matrix.archive }} earth-studio
          mkdir earth-cli
          cp target/release/earth README.md LICENSE earth-cli/
          tar czf ${{ matrix.cli_archive }} earth-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}-${{ matrix.cli_archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.cli_archive }}

  release:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Verify assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            EarthStudio-Kurulum.exe
            earth-cli-windows-x64.exe
            earth-cli-linux-x64.tar.gz
            earth-cli-macos-arm64.tar.gz
            earth-studio-linux-x64.tar.gz
            earth-studio-macos-arm64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            EarthStudio-Kurulum.exe
            earth-cli-*
            earth-studio-*
            SHA256SUMS.txt
