name: Release

# Pushing a tag such as v0.2.0 builds Earth for Windows, Linux and macOS and
# attaches ready-to-download archives to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: earth-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: earth-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: earth-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p earth/ornekler
          cp examples/*.earth earth/ornekler/
          cp README.md LICENSE earth/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/earth.exe earth/
            7z a ${{ matrix.archive }} earth
          else
            cp target/${{ matrix.target }}/release/earth earth/
            tar czf ${{ matrix.archive }} earth
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
