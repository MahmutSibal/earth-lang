name: CI

# Runs only from the "Run workflow" button on the Actions tab: GitHub Actions
# gets no runners on this account yet, so automatic runs only failed and sent
# e-mails. Once Actions works, re-enable them by adding back:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
